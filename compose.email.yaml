# Local SMTP capture only: no external relay or forwarding configuration.
services:
  api:
    environment:
      SMTP_HOST: mailpit
      SMTP_LOCAL_CAPTURE: 'true'
  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    command: ['--disable-version-check','--smtp-disable-rdns','--quiet']
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '500'
      MP_SMTP_ALLOWED_RECIPIENTS: '^[^@]+@[^@]+\.test$$'
    ports: ['127.0.0.1:5185:8025']
    networks: [default,mail]
    volumes: ['mail-data:/data']
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ['CMD','/mailpit','readyz']
      interval: 10s
      timeout: 3s
      retries: 5
  digest-worker:
    image: concord-api:0.1.41-local
    command: ['node','services/core/digest-worker.ts']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://concord:local-development-only@postgres:5432/concord
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_LOCAL_CAPTURE: 'true'
      APP_PUBLIC_URL: http://localhost:3101
    networks: [default,mail]
    depends_on:
      postgres: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ['CMD','node','-e',"const fs=require('node:fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/concord-digest-heartbeat','utf8'))<60000?0:1)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
networks:
  mail:
    internal: true
volumes:
  mail-data:
